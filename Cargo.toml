[workspace]
members = [
    "crates/escape-simd",
    "crates/json-escape-simd",
    "crates/html-escape-simd",
    "cpu-features",
]
default-members = [
    "crates/escape-simd",
    "crates/json-escape-simd",
    "crates/html-escape-simd",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85.0"
repository = "https://github.com/napi-rs/escape-simd"
homepage = "https://github.com/napi-rs/escape-simd"

[workspace.dependencies]
escape-simd = { version = "0.1.0", path = "crates/escape-simd" }
criterion2 = "3"
glob = "0.3"
rand = "0.10"
serde = "1"
serde_json = "1"
v_jsonescape = "0.9"
v_htmlescape = "0.17"
json-escape = "0.3.0"
sonic-rs = "0.5"

[profile.bench]
lto = true
codegen-units = 1
debug = true
strip = false

[profile.instruments]
inherits = "release"
lto = false
debug = true
